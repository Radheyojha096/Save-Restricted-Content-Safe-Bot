{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-24">
    <div class="w-full max-w-md">
        <div class="auth-card glass-card rounded-3xl p-8 md:p-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-full bg-electric/20 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-key text-electric text-2xl"></i>
                </div>
                <h3 class="font-display text-2xl font-bold text-white mb-2">Forgot Password?</h3>
                <p class="text-slate-400">No worries, we'll send you reset instructions.</p>
            </div>

            {% if error %}
            <div class="glass-card rounded-xl p-4 mb-6 border border-red-500/30 bg-red-500/10">
                <p class="text-red-400 text-sm"><i class="fas fa-exclamation-circle mr-2"></i>{{ error }}</p>
            </div>
            {% endif %}

            {% if success %}
            <div class="glass-card rounded-xl p-4 mb-6 border border-green-500/30 bg-green-500/10">
                <p class="text-green-400 text-sm"><i class="fas fa-check-circle mr-2"></i>{{ success }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                <div>
                    <label class="block text-slate-300 text-sm font-medium mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="email" name="email" required
                            class="input-field w-full pl-10 pr-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none"
                            placeholder="you@example.com">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-electric to-purple text-white font-semibold hover:shadow-lg hover:shadow-electric/30 transition-all duration-300 hover:-translate-y-0.5">
                    Send Reset Link
                </button>
            </form>

            <p class="mt-8 text-center text-slate-400 text-sm">
                Remember your password?
                <a href="/auth/login" class="text-electric hover:text-cyan transition-colors font-medium">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
